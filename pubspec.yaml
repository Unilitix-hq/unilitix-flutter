name: unilitix
description: >-
  African-first mobile UX analytics for Flutter on Android and iOS: sessions,
  screens, events, crashes and masked session replay, on the native
  Unilitix SDKs.
version: 3.0.0
homepage: https://unilitix.com
repository: https://github.com/Unilitix-hq/unilitix-flutter
issue_tracker: https://github.com/Unilitix-hq/unilitix-flutter/issues
documentation: https://docs.unilitix.com
topics:
  - analytics
  - monitoring
  - mobile
  - flutter

executables:
  unilitix_symbols:

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  # The symbol upload CLI (bin/unilitix_symbols.dart) and the iOS
  # power-outage upload; every other request is the native SDK's.
  http: ">=1.0.0 <3.0.0"
  # Power-outage contribution state (salt, iOS queue, install id) and the
  # one-time carry-over of the consent decision 2.x stored.
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.unilitix.unilitix_flutter
        pluginClass: UnilitixPlugin
      ios:
        pluginClass: UnilitixPlugin
      web:
        pluginClass: UnilitixPluginWeb
        fileName: unilitix_web.dart
