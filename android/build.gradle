group 'com.unilitix.unilitix_flutter'
version '3.0.0'

buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        // The native Android SDK (com.unilitix:unilitix-android).
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.unilitix.unilitix_flutter'
    compileSdk 35
    defaultConfig {
        minSdk 21
        consumerProguardFiles 'consumer-rules.pro'
    }
    // No native code of its own since 3.0.0: NDK crash capture (signal
    // handler, API 21-29) and ANRs are the Android SDK's.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // The engine: sessions, identity, consent, offline queue, uploads,
    // retries, device/network context, JVM + NDK crashes and ANRs. The plugin
    // only bridges Dart to it (see UnilitixPlugin.kt). Keep in step with
    // the version in README.md "Native SDK versions".
    implementation 'com.unilitix:unilitix-android:1.11.2'

    // Periodic upload of the power-outage log (only scheduled when the app
    // opts in). Plain work-runtime rather than -ktx: the worker is a plain
    // Worker, so the coroutine extensions would be dead weight.
    implementation 'androidx.work:work-runtime:2.9.1'

    testImplementation 'junit:junit:4.13.2'
}
