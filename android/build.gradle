group 'com.unilitix.unilitix_flutter'
version '1.0'

buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.unilitix.unilitix_flutter'
    compileSdk 35
    defaultConfig { minSdk 21 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // Periodic upload of the power-outage log (only scheduled when the app
    // opts in). Plain work-runtime rather than -ktx: the worker is a plain
    // Worker, so the coroutine extensions would be dead weight.
    implementation 'androidx.work:work-runtime:2.9.1'

    testImplementation 'junit:junit:4.13.2'
}
