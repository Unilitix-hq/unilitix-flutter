group 'com.unilitix.unilitix_flutter'
version '1.0'

buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.unilitix.unilitix_flutter'
    compileSdk 35
    defaultConfig {
        minSdk 21
        // Keeps the JNI methods of the native crash handler (bound by name).
        consumerProguardFiles 'consumer-rules.pro'
    }

    // Native crash capture for API 21-29 (src/main/cpp, vendored from the
    // Android SDK by scripts/sync-android-native.sh): a few KB of plain C per
    // ABI. No abiFilters: built for the NDK's ABIs, and the app's
    // abiFilters / splits / --target-platform decide what is packaged. No NDK
    // pin of our own: the line below (from Flutter's plugin_ffi template)
    // keeps AGP's default NDK, which is Flutter's flutter.ndkVersion on
    // current Flutter/AGP pairs (27.0.12077973 with AGP 8.7, as the example).
    ndkVersion android.ndkVersion
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // Periodic upload of the power-outage log (only scheduled when the app
    // opts in). Plain work-runtime rather than -ktx: the worker is a plain
    // Worker, so the coroutine extensions would be dead weight.
    implementation 'androidx.work:work-runtime:2.9.1'

    testImplementation 'junit:junit:4.13.2'
}
