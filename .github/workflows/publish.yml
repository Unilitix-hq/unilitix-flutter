name: Publish to pub.dev

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# A tag must not reach pub.dev until the native plugins compile: 2.1.2 was
# published with a Swift error because this workflow only ran the Dart
# checks. Both platform builds now gate the publish step.
jobs:
  dart-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev
          flutter pub get
      - run: dart analyze --fatal-infos --fatal-warnings
      - run: flutter test
      - name: Tag matches pubspec version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUB=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          test "$TAG" = "$PUB" || { echo "tag $TAG != pubspec $PUB"; exit 1; }

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Build example APK (compiles the Kotlin plugin)
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --debug

  ios-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Build example for iOS simulator (compiles the Swift plugin)
        working-directory: example
        run: |
          flutter pub get
          flutter build ios --simulator --no-codesign

  publish:
    needs: [dart-checks, android-build, ios-build]
    permissions:
      id-token: write   # Required for OIDC auth to pub.dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1   # MUST come before publish — enables OIDC
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
      - run: flutter pub get
      - name: Publish to pub.dev
        run: dart pub publish --force
