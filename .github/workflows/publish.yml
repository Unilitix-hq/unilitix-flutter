name: Publish to pub.dev

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# A tag must not reach pub.dev until the native plugins compile: 2.1.2 was
# published with a Swift error because this workflow only ran the Dart
# checks. Both platform builds and the Android plugin's unit tests now gate
# the publish step. Since 3.0.0 the plugins need the native SDKs: tag only
# after com.unilitix:unilitix-android:1.11.0 is on Maven Central and
# UnilitixCore 0.8.0 is vendored (scripts/sync-ios-core.sh).
jobs:
  dart-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            $(git ls-files 'lib/**.dart' 'test/**.dart' | grep -v '^lib/src/generated/')
      - name: Analyze
        run: dart analyze --fatal-infos --fatal-warnings
      - name: Tests
        run: flutter test
      - name: Dry-run publish
        run: dart pub publish --dry-run
      - name: Tag matches pubspec version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUB=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          test "$TAG" = "$PUB" || { echo "tag $TAG != pubspec $PUB"; exit 1; }

  android-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Build example APK (compiles the Kotlin plugin)
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --debug

  android-unit-tests:
    # JUnit tests of the Kotlin/Java plugin (android/src/test). The plugin is
    # a Gradle subproject of the example app, named after the pub package.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Generate the Gradle project (wrapper, local.properties)
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --debug --config-only
      - name: Plugin unit tests
        if: ${{ hashFiles('android/src/test/**') != '' }}
        working-directory: example/android
        run: ./gradlew --no-daemon :unilitix:testDebugUnitTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: android-unit-test-reports
          path: example/build/unilitix/reports/tests/

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Build example for iOS simulator (compiles the Swift plugin)
        working-directory: example
        run: |
          flutter pub get
          flutter build ios --simulator --no-codesign

  publish:
    needs: [dart-checks, android-unit-tests, android-build, ios-build]
    permissions:
      id-token: write   # Required for OIDC auth to pub.dev
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.32.8'
          channel: stable
      - run: flutter pub get
      - name: Publish to pub.dev
        run: dart pub publish --force
