name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        # The generated contract models are exempt; they are copied verbatim
        # from the API repo.
        run: |
          dart format --output=none --set-exit-if-changed \
            $(git ls-files 'lib/**.dart' 'test/**.dart' | grep -v '^lib/src/generated/')

      - name: Analyze
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Tests
        # Includes the behaviour fixtures against the Dart layer
        # (test/behaviour_runner_test.dart; coverage map in
        # test/behaviour/COVERAGE.md) and the wireframe walk time budget
        # (test/wireframe_benchmark_test.dart).
        run: flutter test --coverage

      - name: Dry-run publish
        # Catches pubspec/README problems before a tag triggers publish.yml.
        # Blocking: a warning here would also fail the real publish.
        run: dart pub publish --dry-run

  android-unit-tests:
    # JUnit tests of the Kotlin/Java plugin (android/src/test). The plugin is
    # a Gradle subproject of the example app, named after the pub package.
    # Needs com.unilitix:unilitix-android:1.11.0 on Maven Central. The
    # plugin has no native code of its own since 3.0.0, so no NDK here.
    runs-on: ubuntu-24.04
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Generate the Gradle project (wrapper, local.properties)
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --debug --config-only
      - name: Plugin unit tests
        if: ${{ hashFiles('android/src/test/**') != '' }}
        working-directory: example/android
        run: ./gradlew --no-daemon :unilitix:testDebugUnitTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: android-unit-test-reports
          path: example/build/unilitix/reports/tests/

  android-build:
    runs-on: ubuntu-24.04
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Install Android NDK (retries a corrupt download)
        # The example pins ndkVersion (debug-symbol stripping of the native
        # SDK's .so files). Gradle installs the NDK itself but gives up on one
        # bad download ("Archive is not a ZIP archive"); install it first.
        run: |
          for i in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" > /dev/null && exit 0
            echo "NDK install failed (attempt $i), retrying in 20 s"; sleep 20
          done
          exit 1
      - name: Build example APK (exercises the Kotlin plugin)
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --debug

      - name: SDK size report
        # What the SDK adds to a host app, measured the way integrators feel
        # it: a release arm64 APK of the example, with the Dart and native
        # breakdown from --analyze-size. Compare against the previous run in
        # the job summary before cutting a release.
        working-directory: example
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --analyze-size --code-size-directory=../build/size 2>&1 | tail -n 60
          APK=build/app/outputs/flutter-apk/app-release.apk
          {
            echo "## SDK size report (example app, release, arm64)"
            echo
            echo "| Artifact | Bytes |"
            echo "|---|---|"
            printf '| app-release.apk | %s |\n' "$(stat -c %s "$APK")"
            echo
            echo "Dependency tree of the SDK (direct):"
            echo
            echo '```'
            (cd .. && dart pub deps --style=compact | grep -E '^(dependencies|- )' | head -n 20)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: SDK size gate (fail above baseline + 2%)
        # The baseline is the example's release arm64 APK size, in bytes, in
        # .github/size-baseline.txt (digits only). Raise it on purpose, in the
        # same PR, when a release adds weight that is worth it (say why in
        # the CHANGELOG). 0 means no baseline yet: the step reports the size
        # and passes. 3.0.0 reset it to 0: the Dart engine and sqflite are
        # gone and the native Android SDK (and its dependencies) came in, so
        # the 2.7.4 figure (8071627) no longer applies. Put the size of the
        # first green 3.0.0 build on main in the file to turn the gate on.
        working-directory: example
        run: |
          SIZE=$(stat -c %s build/app/outputs/flutter-apk/app-release.apk)
          BASE=$(tr -dc '0-9' < ../.github/size-baseline.txt)
          BASE=${BASE:-0}
          if [ "$BASE" -eq 0 ]; then
            echo "::warning::No size baseline yet. Put $SIZE in .github/size-baseline.txt to turn the gate on."
            exit 0
          fi
          LIMIT=$(( BASE + BASE / 50 ))
          DELTA=$(( SIZE - BASE ))
          {
            echo
            echo "| Baseline | Limit (+2%) | This build | Delta |"
            echo "|---|---|---|---|"
            printf '| %s | %s | %s | %+d |\n' "$BASE" "$LIMIT" "$SIZE" "$DELTA"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::Example release APK is $SIZE bytes, over the limit of $LIMIT (baseline $BASE + 2%). Shrink it, or raise .github/size-baseline.txt in this PR with a reason."
            exit 1
          fi
          echo "Size OK: $SIZE bytes (baseline $BASE, limit $LIMIT)"

  integration-test-android:
    # example/integration_test on an Android emulator: Dart layer, platform
    # channel, plugin and native SDK together, uploading to a fake ingest
    # server that the test runs on 127.0.0.1 (debug builds allow cleartext,
    # example/android/app/src/debug/AndroidManifest.xml).
    runs-on: ubuntu-24.04
    needs: analyze-and-test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android NDK (retries a corrupt download)
        run: |
          for i in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" > /dev/null && exit 0
            echo "NDK install failed (attempt $i), retrying in 20 s"; sleep 20
          done
          exit 1
      - name: Get packages
        working-directory: example
        run: flutter pub get
      - name: Integration test on an emulator (API 34)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: example
          script: flutter test integration_test --reporter expanded

  ios-build:
    runs-on: macos-15
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Build example for iOS simulator (compiles the Swift plugin)
        working-directory: example
        run: |
          flutter pub get
          flutter build ios --simulator --no-codesign
